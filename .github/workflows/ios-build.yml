name: iOS Build

# Disabled — no iOS signing contributor yet. See README.
# Uncomment triggers below when an iOS contributor joins.
on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout flacidal-mobile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: flacidal-mobile

      - name: Checkout flacidal-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kushiemoon-dev/flacidal-core
          ref: v0.19.0
          path: flacidal-core
          token: ${{ secrets.CORE_ACCESS_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.x'
          channel: stable

      - name: Cross-compile Go for iOS arm64
        working-directory: flacidal-core
        run: make ios

      - name: Copy .a + header into iOS project
        working-directory: flacidal-mobile
        run: |
          mkdir -p ios/Runner
          cp ../flacidal-core/build/ios/libflacidal.a ios/Runner/
          cp ../flacidal-core/build/ios/libflacidal.h ios/Runner/

      - name: Install Flutter dependencies
        working-directory: flacidal-mobile
        run: flutter pub get

      - name: Build unsigned IPA
        working-directory: flacidal-mobile
        run: flutter build ipa --no-codesign

      - name: Rename IPA
        working-directory: flacidal-mobile
        run: mv build/ios/ipa/*.ipa FLACidal.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FLACidal-iOS
          path: flacidal-mobile/FLACidal.ipa

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: flacidal-mobile/FLACidal.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
