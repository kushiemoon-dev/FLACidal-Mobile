name: iOS Build

# Builds an unsigned IPA for AltStore / SideStore. The Android release job is
# independent: a failure here never blocks it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout flacidal-mobile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: flacidal-mobile

      - name: Read pinned Core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < flacidal-mobile/CORE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout flacidal-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kushiemoon-dev/flacidal-core
          ref: ${{ steps.core.outputs.ref }}
          path: flacidal-core
          token: ${{ secrets.CORE_ACCESS_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: flacidal-core/go.mod

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.x'
          channel: stable

      - name: Cross-compile Go for iOS arm64
        working-directory: flacidal-core
        run: make ios

      - name: Copy .a + header into iOS project
        working-directory: flacidal-mobile
        run: |
          mkdir -p ios/Runner
          cp ../flacidal-core/build/ios/libflacidal.a ios/Runner/
          cp ../flacidal-core/build/ios/libflacidal.h ios/Runner/

      - name: Install Flutter dependencies
        working-directory: flacidal-mobile
        run: flutter pub get

      - name: Build unsigned IPA
        working-directory: flacidal-mobile
        run: flutter build ipa --no-codesign

      - name: Verify libflacidal is linked into the app
        working-directory: flacidal-mobile
        run: |
          BIN=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Runner
          nm -gU "$BIN" | grep -q FlacInit || {
            echo "::error::FlacInit not found in $BIN, libflacidal.a was not linked"
            exit 1
          }

      - name: Rename IPA
        working-directory: flacidal-mobile
        run: mv build/ios/ipa/*.ipa FLACidal.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FLACidal-iOS
          path: flacidal-mobile/FLACidal.ipa

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: flacidal-mobile/FLACidal.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
